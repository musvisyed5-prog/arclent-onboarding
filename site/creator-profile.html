<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>arclent — Set Up Your Creator Profile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            "brand-green": "#034f46",
            "brand-cream": "#ffffeb",
          },
          fontFamily: {
            sans: ["Inter", "ui-sans-serif", "system-ui", "sans-serif"],
          },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="min-h-screen font-sans">
  <div class="min-h-screen flex items-start justify-center bg-[#f5f5e6] p-4 py-8 lg:items-center">
    <div class="flex w-full max-w-[1440px] flex-col gap-6 lg:min-h-[640px] lg:flex-row">

      <!-- Sidebar -->
      <aside
        class="flex w-full flex-col rounded-3xl border-[1.5px] border-black px-5 py-6 text-white shadow-sm lg:w-[36%] lg:min-w-[260px] lg:px-7 lg:py-8"
        style="background: linear-gradient(180deg, #000000 0%, #054d44 100%)"
      >
        <div class="mb-6 flex items-center">
          <img src="https://i.ibb.co/nqP1hFK9/newwwww-removebg-preview.png" alt="arclent" class="h-8 w-auto lg:h-9" />
        </div>

        <div class="mb-6">
          <div class="mb-1.5 flex items-center justify-between text-xs font-medium text-white/60">
            <span>Progress</span>
            <span>40%</span>
          </div>
          <div class="h-1.5 w-full overflow-hidden rounded-full bg-white/10">
            <div class="h-full rounded-full transition-[width] duration-500 ease-out" style="width:40%; background-color:#FFA845"></div>
          </div>
        </div>

        <nav class="relative flex flex-1 flex-col justify-evenly">
          <div class="pointer-events-none absolute top-[9%] bottom-[9%] left-[26px] w-px bg-white/8"
            style="mask-image: linear-gradient(to bottom, transparent, black 12%, black 88%, transparent); -webkit-mask-image: linear-gradient(to bottom, transparent, black 12%, black 88%, transparent);">
            <div class="w-full transition-[height] duration-700 ease-out" style="height:25%; background-color:#FFA845; opacity:0.6"></div>
          </div>

          <button type="button" class="relative z-10 flex items-center gap-3 rounded-xl px-2 py-2.5 text-left cursor-pointer">
            <div class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg text-brand-green" style="background-color:#f0d7ff">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m5 13 4 4L19 7"/></svg>
            </div>
            <div>
              <p class="text-sm font-semibold leading-tight text-white">Link Your Channel</p>
              <p class="text-xs leading-tight text-white/50">Completed</p>
            </div>
          </button>

          <button type="button" class="relative z-10 flex items-center gap-3 rounded-xl px-2 py-2.5 text-left cursor-pointer">
            <div class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg text-white animate-soft-pulse" style="background-color:#FFA845">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="7" width="18" height="14" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
            </div>
            <div>
              <p class="text-sm font-semibold leading-tight text-white">Confirm Details</p>
              <p class="text-xs leading-tight text-white/70">Review what AI found</p>
            </div>
          </button>

          <button type="button" disabled class="relative z-10 flex items-center gap-3 rounded-xl px-2 py-2.5 text-left cursor-not-allowed">
            <div class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg bg-white/10 text-white/60">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11Z"/></svg>
            </div>
            <div>
              <p class="text-sm font-semibold leading-tight text-white/60">Connect Platforms</p>
              <p class="text-xs leading-tight text-white/40">Link your social accounts</p>
            </div>
          </button>

          <button type="button" disabled class="relative z-10 flex items-center gap-3 rounded-xl px-2 py-2.5 text-left cursor-not-allowed">
            <div class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg bg-white/10 text-white/60">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="m10 8 6 4-6 4V8z"/></svg>
            </div>
            <div>
              <p class="text-sm font-semibold leading-tight text-white/60">Verify Your Work</p>
              <p class="text-xs leading-tight text-white/40">Show us what you've made</p>
            </div>
          </button>

          <button type="button" disabled class="relative z-10 flex items-center gap-3 rounded-xl px-2 py-2.5 text-left cursor-not-allowed">
            <div class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg bg-white/10 text-white/60">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13"/><path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5C11 3 12 8 12 8"/><path d="M16.5 8a2.5 2.5 0 0 0 0-5C13 3 12 8 12 8"/></svg>
            </div>
            <div>
              <p class="text-sm font-semibold leading-tight text-white/60">Rewards &amp; Points</p>
              <p class="text-xs leading-tight text-white/40">Start earning as you grow</p>
            </div>
          </button>
        </nav>

        <div class="mt-6 flex items-center justify-between text-sm font-semibold">
          <a href="creator-onboarding.html" class="flex items-center gap-2">
            <span>&larr;</span> Back
          </a>
          <button type="button">Need Help ?</button>
        </div>
      </aside>

      <!-- Main panel -->
      <main class="flex flex-1 flex-col rounded-3xl border-[1.5px] border-black bg-brand-cream px-5 py-6 shadow-sm lg:px-10 lg:py-10">
        <p class="text-sm font-medium text-black/60">Step 2 of 5</p>
        <div class="mt-2 mb-6 flex gap-1.5">
          <span class="h-1.5 flex-1 rounded-full" style="background-color:#FFA845"></span>
          <span class="h-1.5 flex-1 rounded-full" style="background-color:#FFA845"></span>
          <span class="h-1.5 flex-1 rounded-full bg-black/10"></span>
          <span class="h-1.5 flex-1 rounded-full bg-black/10"></span>
          <span class="h-1.5 flex-1 rounded-full bg-black/10"></span>
        </div>

        <h1 class="mb-6 text-2xl font-bold text-black font-display">Set Up Your Creator Profile.</h1>

        <div id="form-content">
          <div class="mb-6 flex flex-wrap items-center justify-between gap-3 rounded-2xl border border-white/15 bg-brand-green px-5 py-4">
            <div class="flex items-center gap-3">
              <div class="flex h-11 w-11 items-center justify-center rounded-full bg-white">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" class="text-brand-green">
                  <rect x="2" y="10" width="20" height="4" rx="2" transform="rotate(45 12 12)"/>
                  <rect x="2" y="10" width="20" height="4" rx="2" transform="rotate(-45 12 12)"/>
                </svg>
              </div>
              <span class="font-semibold text-white">Profile Photo</span>
            </div>
            <div class="flex gap-2">
              <button type="button" class="rounded-md bg-white px-4 py-1.5 text-sm font-semibold text-black">Upload</button>
              <button type="button" class="rounded-md bg-white/20 px-4 py-1.5 text-sm font-semibold text-white">Remove</button>
            </div>
          </div>

          <div class="rounded-2xl border-[1.5px] border-black p-5">
            <label class="mb-2 block text-sm font-semibold text-black">Creator Name</label>
            <input
              type="text"
              placeholder="Alex Morgan"
              class="mb-5 w-full rounded-xl border-[1.5px] border-black bg-white px-4 py-3 text-sm placeholder:text-black/40 focus:outline-none focus:ring-2 focus:ring-brand-green"
            />

            <label class="mb-2 block text-sm font-semibold text-black">Content Niche</label>
            <select class="mb-5 w-full rounded-xl border-[1.5px] border-black bg-white px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-brand-green">
              <option>Beauty</option>
              <option>Gaming</option>
              <option>Tech &amp; Reviews</option>
              <option>Fitness</option>
              <option>Comedy</option>
              <option>Lifestyle</option>
            </select>

            <label class="mb-2 block text-sm font-semibold text-black">Primary Platform</label>
            <select class="mb-5 w-full rounded-xl border-[1.5px] border-black bg-white px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-brand-green">
              <option>YouTube</option>
              <option>Instagram</option>
              <option>TikTok</option>
              <option>Twitch</option>
            </select>

            <label class="mb-2 block text-sm font-semibold text-black">Follower Count</label>
            <select class="w-full rounded-xl border-[1.5px] border-black bg-white px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-brand-green">
              <option>0 – 1K</option>
              <option>1K – 10K</option>
              <option>10K – 100K</option>
              <option>100K+</option>
            </select>
          </div>

          <p class="mt-6 text-center text-sm text-black/60">
            Don't see your niche listed? Send us a message with the button in the bottom right corner or email us at
            <span class="font-semibold text-black">support@arclent.co</span>
          </p>
        </div>

        <div id="footer-nav" class="mt-auto flex gap-3 pt-6">
          <a href="creator-onboarding.html" class="flex h-12 w-12 shrink-0 items-center justify-center rounded-md border-[1.5px] border-black text-black hover:bg-black/5">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m15 18-6-6 6-6"/></svg>
          </a>
          <button id="continue-btn" type="button" class="btn-hard flex-1 rounded-md border-[1.5px] border-black bg-brand-green py-3 text-center text-sm font-bold text-white hover:opacity-90">
            Continue
          </button>
        </div>
      </main>

    </div>
  </div>

  <script>
    document.getElementById("continue-btn").addEventListener("click", function () {
      window.location.href = "creator-connect.html";
    });
  </script>
</body>
</html>
