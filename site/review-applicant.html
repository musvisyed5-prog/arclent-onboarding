  <style>
    /* Scroll-reveal system: fade + rise, corporate-editorial timing (see motion-design skill). */
    [data-reveal] {
      opacity: 0;
      transform: translateY(28px);
      transition: opacity 0.9s cubic-bezier(0.16, 1, 0.3, 1), transform 0.9s cubic-bezier(0.16, 1, 0.3, 1);
    }
    [data-reveal].is-visible { opacity: 1; transform: translateY(0); }

    [data-reveal-group] > * {
      opacity: 0;
      transform: translateY(14px);
      transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }
    [data-reveal-group].is-visible > * { opacity: 1; transform: translateY(0); }
    [data-reveal-group] > *:nth-child(1) { transition-delay: 0ms; }
    [data-reveal-group] > *:nth-child(2) { transition-delay: 70ms; }
    [data-reveal-group] > *:nth-child(3) { transition-delay: 140ms; }
    [data-reveal-group] > *:nth-child(4) { transition-delay: 210ms; }
    [data-reveal-group] > *:nth-child(5) { transition-delay: 280ms; }
    [data-reveal-group] > *:nth-child(6) { transition-delay: 350ms; }

    .msg-tip { animation: msg-tip-in .18s ease-out; }
    .msg-tip::before { content: ""; position: absolute; left: 20px; top: -6px; width: 12px; height: 12px; background: inherit; transform: rotate(45deg); border-radius: 2px; }
    @keyframes msg-tip-in { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
    .hfc-dot { animation: hfc-pulse 1.8s ease-in-out infinite; }
    @keyframes hfc-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
    @media (prefers-reduced-motion: reduce) {
      [data-reveal], [data-reveal-group] > * { opacity: 1 !important; transform: none !important; transition: none !important; }
    }

    /* ---- Y Combinator-inspired system: warm paper background, near-black ink,
       one orange accent, Source Serif 4 headlines with italic emphasis, Outfit
       light UI text, hairline borders, black pill buttons, no shadows. ---- */
    .bg-noise { display: none; }
    body { font-weight: 300; }
    h1, h2, h3 { letter-spacing: -0.01em; font-weight: 400; }
    em { font-style: italic; }

    /* ---- Integrated Biosciences-style system: Abyssal Ink #222F30 + Bone White
       #F7F7F5, single-weight Inter Tight (Aspekta substitute) with tight
       tracking, Roboto Mono for labels, 1px hairlines, no shadows/gradients,
       Bioluminescent Lime #CEF79E rationed to micro-surfaces. ---- */
    .bg-noise { display: none; }
    body { font-family: 'Inter Tight', ui-sans-serif, system-ui, sans-serif; letter-spacing: -0.001em; }
    body *:not(svg):not(path) { font-weight: 400 !important; font-style: normal !important; }
    h1, h2, h3 { letter-spacing: -0.02em; line-height: 1.1; }
    .font-mono, .mono { font-family: 'Roboto Mono', ui-monospace, monospace; letter-spacing: -0.02em; }

    .glass-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid #4D5757;
      border-radius: 16px;
      position: relative;
      overflow: hidden;
    }

    /* Filled action button: white on dark, mono, 8px radius, no border. */
    .glass-pill {
      background: #FFFFFF;
      color: #222F30 !important;
      border: 0;
      border-radius: 8px !important;
      font-family: 'Roboto Mono', ui-monospace, monospace !important;
      font-size: 13px !important;
      text-transform: uppercase;
      letter-spacing: -0.02em;
      transition: opacity 0.2s ease;
    }
    .glass-pill:hover { opacity: 0.85; }
    .glass-pill--accent { background: #FFFFFF; }
    /* Outlined ghost button */
    .glass-pill--neutral { background: transparent; color: #FFFFFF !important; border: 1px solid #4D5757; }

    .btn-brutal {
      border-radius: 8px !important;
      font-family: 'Roboto Mono', ui-monospace, monospace !important;
      font-size: 13px !important;
      text-transform: uppercase;
      letter-spacing: -0.02em;
      box-shadow: none !important;
      transition: opacity 0.2s ease;
    }
    .btn-brutal:hover { opacity: 0.85; }
    @media (prefers-reduced-motion: reduce) { .glass-pill, .btn-brutal { transition: none !important; } }

    .glass-nav { background: transparent; }

    /* ---- micro-interactions: expo-out (0.16,1,0.3,1) for colour/shape changes,
       ease-in-out-quart (0.76,0,0.24,1) for quick text slides ---- */
    :root { --ease-out: cubic-bezier(0.16, 1, 0.3, 1); --ease-io: cubic-bezier(0.76, 0, 0.24, 1); }

    .nav-pill { transition: background-color 0.6s var(--ease-out), color 0.6s var(--ease-out), border-color 0.6s var(--ease-out); }
    .nav-pill:hover { background: #CEF79E; border-color: #CEF79E; color: #222F30; }

    .roll { display: block; height: 1.25em; line-height: 1.25em; overflow: hidden; }
    .roll > span { display: block; transition: transform 0.3s var(--ease-io); }
    .btn-roll:hover .roll > span, .btn-pair:hover .roll > span { transform: translateY(-100%); }

    .btn-dark { transition: background-color 0.6s var(--ease-out), color 0.6s var(--ease-out); }
    .btn-dark:hover { opacity: 1; background: #CEF79E; color: #222F30; }

    .btn-ghost { transition: background-color 0.6s var(--ease-out), color 0.6s var(--ease-out), border-color 0.6s var(--ease-out); }
    .btn-ghost:hover { opacity: 1; background: #FFFFFF; color: #222F30; border-color: #FFFFFF; }

    /* label + arrow pair: hovering either swaps their fills */
    .pair-a, .pair-b { transition: background-color 0.6s var(--ease-out), color 0.6s var(--ease-out); }
    .pair-a { background: #222F30; color: #FFFFFF; }
    .pair-b { background: #CEF79E; color: #222F30; }
    .btn-pair:hover .pair-a { background: #CEF79E; color: #222F30; }
    .btn-pair:hover .pair-b { background: #222F30; color: #CEF79E; }
    .pair-b svg { transition: transform 0.4s var(--ease-io); }
    .btn-pair:hover .pair-b svg { transform: translateX(3px); }

    /* menu button: two lime lines that cross into an X */
    .menu-btn { position: relative; width: 40px; height: 40px; border-radius: 10px; background: #222F30; border: 1px solid transparent; transition: background-color 0.6s var(--ease-out), border-color 0.6s var(--ease-out); }
    .menu-btn:hover { border-color: #CEF79E; }
    .menu-btn i { position: absolute; left: 11px; right: 11px; height: 1.5px; background: #CEF79E; transition: transform 0.6s var(--ease-out), top 0.6s var(--ease-out); }
    .menu-btn i:nth-child(1) { top: 16px; } .menu-btn i:nth-child(2) { top: 22px; }
    .menu-open .menu-btn i:nth-child(1) { top: 19px; transform: rotate(45deg); }
    .menu-open .menu-btn i:nth-child(2) { top: 19px; transform: rotate(-45deg); }

    .menu-overlay {
      position: fixed; inset: 6px; z-index: 40; border-radius: 20px; background: #222F30; color: #fff;
      clip-path: inset(0 0 100% 0 round 20px); visibility: hidden;
      transition: clip-path 0.8s var(--ease-out), visibility 0s linear 0.8s;
    }
    .menu-open .menu-overlay { clip-path: inset(0 0 0 0 round 20px); visibility: visible; transition: clip-path 0.8s var(--ease-out), visibility 0s; }
    .menu-overlay .m-item { display: block; opacity: 0; transform: translateY(36px); transition: opacity 0.7s var(--ease-out), transform 0.7s var(--ease-out); }
    .menu-open .menu-overlay .m-item { opacity: 1; transform: none; transition-delay: calc(0.18s + var(--i) * 0.07s); }
    .menu-open { overflow: hidden; }


    /* desktop: logo floats on its own, links + CTA live in one frosted group (right) */
    @media (min-width: 1024px) {
      .ib-nav { background: transparent !important; -webkit-backdrop-filter: none !important; backdrop-filter: none !important; padding: 6px 0 !important; }
      .nav-group { background: rgba(255, 255, 255, 0.8); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border-radius: 12px; padding: 4px 4px 4px 12px; }
    }


    /* ---- two-part button: label + interlocking arrow tab. Hover swaps the fills
       (label goes lime, tab goes dark), the label tightens toward the tab and the
       tab slides forward. Easing cubic-bezier(.25,1,.5,1), 0.6s. ---- */
    .ib-btn { --bg: #222F30; --fg: #FFFFFF; --tab: #CEF79E; --tab-ink: #222F30; --hov: #CEF79E; --hov-ink: #222F30;
      display: inline-flex; align-items: stretch; height: 48px; cursor: pointer; border: 0; background: none; padding: 0;
      font-family: 'Roboto Mono', ui-monospace, monospace; font-size: 13px; letter-spacing: -0.02em; text-transform: uppercase; text-decoration: none; }
    .ib-btn--light { --bg: #FFFFFF; --fg: #222F30; }
    .ib-btn .lbl, .ib-btn .corner path, .ib-btn .ico path, .ib-btn .ico, .ib-btn .arrow { transition-duration: 0.75s; transition-timing-function: cubic-bezier(0.22, 1, 0.36, 1); }
    .ib-btn .lbl { position: relative; display: flex; align-items: center; padding: 0 8px 0 20px; margin-inline-end: 16px; white-space: nowrap;
      background: var(--bg); color: var(--fg); border-radius: 12px 0 0 12px;
      transition-property: background-color, color, margin-inline-end, padding-right; }
    .ib-btn .corner { position: absolute; top: 0; left: 100%; width: 16px; height: 100%; display: block; }
    .ib-btn .corner svg { display: block; width: 100%; height: 100%; }
    .ib-btn .corner path { fill: var(--bg); transition-property: fill; }
    .ib-btn .ico { display: block; width: 46px; transition-property: transform; }
    .ib-btn .ico svg { display: block; width: 100%; height: 100%; }
    .ib-btn .ico .shape { fill: var(--tab); transform-box: fill-box; transform-origin: right center; transition-property: fill, transform; }
    .ib-btn .ico .arrow { stroke: var(--tab-ink); transition-property: stroke; }
    .ib-btn:hover .lbl, .ib-btn:focus-visible .lbl { background: var(--hov); color: var(--hov-ink); margin-inline-end: 13px; padding-right: 11px; }
    .ib-btn:hover .corner path, .ib-btn:focus-visible .corner path { fill: var(--hov); }
        .ib-btn:hover .ico .shape, .ib-btn:focus-visible .ico .shape { fill: #222F30; transform: scaleX(0.92); }
    .ib-btn:hover .ico .arrow, .ib-btn:focus-visible .ico .arrow { stroke: #CEF79E; }
    .ib-btn--light:hover .ico .shape { fill: #222F30; }
    .ib-btn:active { transform: scale(0.98); }
    @media (prefers-reduced-motion: reduce) { .hfc-dot, .ib-btn .lbl, .ib-btn .corner path, .ib-btn .ico, .ib-btn .ico path { transition: none !important; } }


    /* smooth scrolling (Lenis) */
    html.lenis, html.lenis body { height: auto; }
    .lenis.lenis-smooth { scroll-behavior: auto !important; }
    .lenis.lenis-smooth [data-lenis-prevent] { overscroll-behavior: contain; }
    .lenis.lenis-stopped { overflow: hidden; }
    a, button { -webkit-tap-highlight-color: transparent; }


    /* nav CTA (from the reference recording): dark button, a white fill wipes up from
       the bottom while the label rolls up; final state white with dark text */
    .cta-wipe { position: relative; overflow: hidden; background: #222F30 linear-gradient(#fff, #fff) no-repeat 0 100% / 100% 0%;
      transition: background-size 0.3s cubic-bezier(0.76, 0, 0.24, 1); }
    .cta-wipe:hover, .cta-wipe:focus-visible { background-color: #222F30; background-size: 100% 100%; color: #222F30; }
    .cta-wipe .roll > span:nth-child(2) { color: #222F30; }
    .btn-dark.cta-wipe:hover { background: #222F30 linear-gradient(#fff, #fff) no-repeat 0 100% / 100% 100%; color: #222F30; }

    /* nav links: a soft light chip fades in behind the hovered link */
    .nav-links a { position: relative; text-decoration: none; background: none !important; isolation: isolate; }
    .nav-links a::before { content: ""; position: absolute; inset: 3px 2px; z-index: -1; border-radius: 8px; background: rgba(255, 255, 255, 0.75);
      opacity: 0; transform: scale(0.94); transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1), transform 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
    .nav-links a:hover::before, .nav-links a:focus-visible::before { opacity: 1; transform: scale(1); }


    /* footer back-to-top */
    .to-top { transition: background-color 0.6s cubic-bezier(0.25, 1, 0.5, 1), color 0.6s cubic-bezier(0.25, 1, 0.5, 1), border-color 0.6s cubic-bezier(0.25, 1, 0.5, 1); }
    .to-top:hover { background: #CEF79E; color: #222F30; border-color: #CEF79E; }
    .to-top svg { transition: transform 0.4s cubic-bezier(0.76, 0, 0.24, 1); }
    .to-top:hover svg { transform: translateY(-3px); }
    #site-footer li a { display: inline-block; }


    /* logo sits on a soft light chip so it reads over any background */
    .logo-chip { display: inline-flex; align-items: center; padding: 12px 16px; border-radius: 12px;
      background: rgba(247, 247, 245, 0.92); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
      transition: background-color 0.6s cubic-bezier(0.25, 1, 0.5, 1); }
    .logo-chip:hover { background: #FFFFFF; }
    /* over the hero: no chip, white logo; chip fades in once scrolling starts */
    html:not(.is-scrolled) .logo-chip { background: transparent; -webkit-backdrop-filter: none; backdrop-filter: none; }
    .nav-logo { transition: filter 0.6s cubic-bezier(0.25, 1, 0.5, 1); }
    html:not(.is-scrolled) .nav-logo { filter: invert(1); }
    @media (max-width: 1023px) { html:not(.is-scrolled) .nav-logo { filter: none; } }  /* mobile: the whole bar is frosted-light, keep the dark logo */
    .btn-dark { white-space: nowrap; flex-shrink: 0; }
    /* keyboard focus: quiet ink ring on light surfaces, lime on dark ones */
    :where(a, button, input, select, textarea, [tabindex]):focus-visible { outline: 2px solid #222F30; outline-offset: 3px; }
    :where(.bg-ink, footer, #menu-overlay, .menu-overlay) :where(a, button, input, select, textarea, [tabindex]):focus-visible { outline-color: #CEF79E; }


    /* hero intro: copy stays hidden until GSAP is ready (no flash) */
    .hero-pending #hero-h1, .hero-pending #hero-p, .hero-pending #hero-cta, .hero-pending .ib-nav { visibility: hidden; }
    .line-mask { display: block; overflow: clip; padding-bottom: 0.14em; margin-bottom: -0.14em; }
    .line-mask > .line { display: block; will-change: transform; }


    /* GSAP owns these interactions once it loads (html.gsap-btn); plain CSS hovers remain as fallback */
    .gsap-btn .btn-ghost { position: relative; isolation: isolate; overflow: hidden; }
    .gsap-btn .btn-ghost:hover { background: transparent !important; color: #FFFFFF; border-color: rgba(255, 255, 255, 0.7); }
    .gsap-btn .ib-btn:active { transform: none; }
    .btn-ghost .gfill { position: absolute; left: 0; top: 0; z-index: -1; border-radius: 50%; background: #FFFFFF; pointer-events: none; transform: scale(0); }
    .ib-btn, .btn-ghost, .cta-wipe, .to-top, .menu-btn { will-change: transform; touch-action: manipulation; }


    #hero-tilt { will-change: transform; transform-style: preserve-3d; }

    /* text links: underline grows in from the left */
    .u-link, footer a { background: linear-gradient(currentColor, currentColor) 0 100% / 0 1px no-repeat; transition: background-size 0.3s var(--ease-out); }
    .u-link:hover, footer a:hover { background-size: 100% 1px; }

    /* scrolling text strip */
    .marquee-track { display: flex; width: max-content; animation: marquee 45s linear infinite; }
    .marquee-strip:hover .marquee-track { animation-play-state: paused; }
    @keyframes marquee { to { transform: translateX(-50%); } }
    @media (prefers-reduced-motion: reduce) {
      .marquee-track { animation: none; }
      .menu-overlay, .menu-overlay .m-item, .nav-pill, .btn-dark, .btn-ghost, .pair-a, .pair-b, .roll > span { transition: none !important; }
    }

    .ib-nav {
      background: rgba(247, 247, 245, 0.72);
      -webkit-backdrop-filter: blur(20px) saturate(1.4);
      backdrop-filter: blur(20px) saturate(1.4);
    }
    .btn-dark, .btn-ghost {
      border-radius: 12px;
      font-family: 'Roboto Mono', ui-monospace, monospace;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: -0.02em;
      transition: opacity 0.2s ease;
    }
    .btn-dark { background: #222F30; color: #FFFFFF; }
    .btn-ghost { border: 1px solid rgba(255, 255, 255, 0.7); color: #FFFFFF; }
    .btn-dark:hover, .btn-ghost:hover { opacity: 0.85; }


    /* Segmented toggles: hairline pills, lime fill when active. */
    .glass-seg { background: transparent; border: 1px solid #C9CBBE; border-radius: 9999px; font-family: 'Roboto Mono', ui-monospace, monospace; }
    #verify-stage .glass-seg, #outreach-stage .glass-seg { background: transparent; border-color: #4D5757; }
    .glass-seg-active { background: #CEF79E !important; color: #222F30 !important; box-shadow: none; }

    .glass-badge { background: #FFFFFF; border: 1px solid #C9CBBE; }

    @keyframes demo-caret-blink { 0%, 45% { opacity: 1; } 50%, 95% { opacity: 0; } 100% { opacity: 1; } }
    #demo-caret { animation: demo-caret-blink 1s step-end infinite; }
    @keyframes demo-dot-bounce { 0%, 60%, 100% { transform: translateY(0); opacity: 0.5; } 30% { transform: translateY(-3px); opacity: 1; } }
    .demo-dot { animation: demo-dot-bounce 1.1s ease-in-out infinite; }
  
  </style>

    const STATUSES = ["Applied", "Under Review", "Shortlisted", "Rejected"];
    const PILL = { "Under Review": "bg-[#E6F4D3] text-[#3C6B1E]", Rejected: "bg-[#F9DDDD] text-[#B93A3A]", Applied: "bg-[#EEEEEE] text-ink", Shortlisted: "bg-[#CEF79E] text-ink" };

    const avatar = (p, n = 64) => p.a ? `<span class="shrink-0 rounded-full bg-cover bg-center" style="width:${n}px;height:${n}px;background-image:url('${p.a}')"></span>` : `<span class="grid shrink-0 place-items-center rounded-full font-mono text-[20px] text-white" style="width:${n}px;height:${n}px;background:${p.c}">${esc(p.ini)}</span>`;
    const say = (m) => { const t = document.createElement("p"); t.className = "mono fixed bottom-24 right-6 z-[90] rounded-[10px] bg-ink px-4 py-3 text-[#CEF79E]"; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 2400); };
    const idx = Math.max(0, Math.min(people.length - 1, +new URLSearchParams(location.search).get("i") || 0)), p = people[idx];
    const fmtN = (n) => n >= 1e6 ? (n / 1e6).toFixed(n >= 1e7 ? 0 : 1).replace(/\.0$/, "") + "M" : n >= 1e3 ? (n / 1e3).toFixed(n >= 1e5 ? 0 : 1).replace(/\.0$/, "") + "K" : String(n);
    const hash = (s) => { let h = 7; for (const c of s) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h; };
    const ROLES2 = ["Thumbnail Designer", "Video Editor", "Short-form Editor", "Channel Manager", "Scriptwriter", "Community Manager"];
    const LOCS = ["Nottingham, United Kingdom", "Austin, United States", "Lagos, Nigeria", "Manila, Philippines", "Toronto, Canada", "Warsaw, Poland", "Mumbai, India", "Berlin, Germany"];
    const LANGS = ["English", "English, Spanish", "English, Tagalog", "English, Hindi", "English, Polish"];
    const REVIEWERS = [["Kevin Campos", "Voice AI", 719], ["Mara Lindqvist", "Northwind Games", 1440000], ["Theo Baptiste", "Baptiste Studio", 3100], ["Priya Varma", "Varma Vlogs", 452], ["Noah Fischer", "Fischer Media", 58200]];
    const REVIEW_TXT = ["She\u2019s been extremely helpful when editing my videos as well as supportive. Not only has she overdelivered on every brief, she flagged issues before we even noticed them.", "Turnaround was fast and the final cuts consistently beat our previous retention. Would hire again without hesitation.", "Communicated clearly at every step and matched our channel\u2019s tone perfectly. One of the best collaborators we\u2019ve worked with."];
    const CLIENT_NAMES = ["MrBeast Gaming", "Voice AI", "Northwind Games", "Baptiste Studio", "Varma Vlogs", "Fischer Media", "Only Brilliant Chess", "Hoops", "NotJasonVlogs", "Kashmirvista"];
    const VIDEO_TITLES = ["Ibadan\u2019s Best Food Tour! Friendliest City In Nigeria?", "24 Hours in Tokyo\u2019s Busiest District", "I Tried Every Burger in NYC", "We Built a House in 48 Hours"];
    const VIDEO_THUMBS = ["https://images.unsplash.com/photo-1710777932534-2a58edf3603d?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&q=80&w=500", "https://images.unsplash.com/photo-1585102651425-8caf7848e44b?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&q=80&w=500", "https://images.unsplash.com/photo-1569572702917-86ac962faac4?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&q=80&w=500", "https://images.unsplash.com/photo-1710974431911-81d457314c85?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&q=80&w=500"];
    function buildExtra(p) {
      const h = hash(p.n);
      const months = 4 + (h % 30), d = new Date(); d.setMonth(d.getMonth() - months);
      const revN = 1 + (h % 3);
      const reviews = Array.from({ length: revN }, (_, i) => { const r = REVIEWERS[(h + i * 7) % REVIEWERS.length]; return { name: r[0], role: r[1], subs: r[2], text: REVIEW_TXT[(h + i * 3) % REVIEW_TXT.length] }; });
      const vcN = 2 + (h % 4);
      const vClients = Array.from({ length: vcN }, (_, i) => ({ name: CLIENT_NAMES[(h + i * 5) % CLIENT_NAMES.length], views: 400 + ((h + i * 131) % 1500000), photo: (h + i) % 3 === 0 ? PHOTOS[(h + i) % PHOTOS.length] : "", color: COLORS[(h + i) % COLORS.length] }));
      const ccN = 1 + ((h >>> 2) % 3);
      const claimed = Array.from({ length: ccN }, (_, i) => CLIENT_NAMES[(h + 10 + i * 3) % CLIENT_NAMES.length]);
      return {
        role: ROLES2[(h >>> 5) % ROLES2.length], loc: LOCS[h % LOCS.length], lang: LANGS[(h >>> 3) % LANGS.length],
        expSince: d.toLocaleDateString(undefined, { month: "short", year: "numeric" }), verVideos: 3 + (h % 24),
        reviews, vClients, claimed,
        video: { title: VIDEO_TITLES[h % VIDEO_TITLES.length], views: 50000 + (h % 900000), likes: 500 + (h % 9000), thumb: VIDEO_THUMBS[h % VIDEO_THUMBS.length] },
        fitLink: `https://www.playbook.com/s/${p.n.toLowerCase().replace(/[^a-z0-9]+/g, "")}/${(h % 0xffffffff).toString(16)}`,
      };
    }
    const ex = buildExtra(p);
    const SKEY = `ja:${key}:${idx}`;
    try { const o = sessionStorage.getItem(SKEY); if (o) p.s = o; } catch (e) {}
    $("back").href = `job-applicants?id=${key}`; document.title = `arclent \u2014 Review ${p.n}`;
    const ANSWERS = [["Portfolio link", "https://youtube.com/@channel"], ["Years of experience", "2 years"], ["When can you start?", "Immediately"]];
    const [first, ...rest] = p.n.split(" ");
    let status = p.s;
    function draw() {
      $("ra-root").innerHTML = `
        <p class="mono text-primary">Review applicant</p>
        <div class="mt-3 flex flex-wrap items-end justify-between gap-6">
          <h1 class="text-[clamp(44px,6.4vw,104px)] font-normal leading-[.94] tracking-[-0.055em] text-ink">${esc(first)}${rest.length ? ` <span class="text-primary/45">${esc(rest.join(" "))}</span>` : ""}</h1>
          <span class="mono mb-2 rounded-[8px] px-3 py-1.5 ${PILL[p.s]}">${p.s}</span>
        </div>
        <p class="mt-5 max-w-[760px] text-[18px] leading-snug text-primary">Review the application, evaluate the candidate's responses and update their status for the ${esc(job.title)} position.</p>

        <div class="mt-10">
          <article class="relative overflow-hidden rounded-[24px] bg-ink p-6 text-white sm:p-8 lg:p-10">
            <svg class="pointer-events-none absolute inset-0 h-full w-full opacity-40" aria-hidden="true"><defs><pattern id="rap" width="260" height="180" patternUnits="userSpaceOnUse" patternTransform="rotate(-28)"><rect x="8" y="8" width="240" height="160" rx="60" fill="none" stroke="#4D5757" stroke-width="1"/></pattern></defs><rect width="100%" height="100%" fill="url(#rap)"/></svg>
            <div class="relative">
              <div class="flex flex-wrap items-start justify-between gap-5">
                <div class="flex items-center gap-4">${avatar(p, 64)}<div class="min-w-0"><p class="text-[22px] leading-tight tracking-[-0.01em]">${esc(p.n)}</p><p class="mono mt-1 text-white/55">${esc(ex.role)}</p></div></div>
                <div class="flex flex-wrap gap-2">
                  <div class="relative">
                    <button type="button" id="msg-btn" class="mono inline-flex h-11 items-center gap-2 rounded-[10px] bg-[#394546] px-4 text-white transition-colors hover:bg-[#4A5859]">${ic('<path d="M22 17a2 2 0 0 1-2 2H6.828a2 2 0 0 0-1.414.586l-2.202 2.202A.71.71 0 0 1 2 21.286V5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2z"/>', 16)}Message</button>
                    <div id="msg-tip" role="tooltip" hidden class="msg-tip absolute left-0 top-[calc(100%+10px)] z-20 w-64 rounded-[12px] bg-[#1c2627]/95 p-4 text-[14px] leading-snug text-white shadow-xl backdrop-blur-sm">In the Undecided step, messaging applicants is unavailable. Please select applicants to proceed and begin messaging.</div>
                  </div>
                  <button type="button" data-act="Rejected" class="mono h-11 rounded-[10px] px-4 outline outline-1 -outline-offset-1 outline-[#FF8A8A]/60 text-[#FF8A8A] transition-colors hover:bg-[#FF8A8A] hover:text-ink">${ic('<path d="M18 6 6 18"/><path d="m6 6 12 12"/>', 15)} Reject</button>
                  <button type="button" data-act="Shortlisted" class="mono h-11 rounded-[10px] bg-[#CEF79E] px-4 text-ink transition-colors hover:bg-white">${ic('<path d="m5 12 5 5 9-10"/>', 15)} Shortlist</button>
                </div>
              </div>

              <div class="mt-8 border-t border-white/15 pt-6">
                <p class="mono text-white/50">General info</p>
                <dl class="mt-4 flex flex-wrap gap-x-8 gap-y-3 text-[15px] text-white/80">
                  <div class="flex items-center gap-2">${ic('<rect width="20" height="14" x="2" y="6" rx="2"/><path d="M16 20V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>')}Verified Experience: ${esc(ex.expSince)}</div>
                  <div class="flex items-center gap-2">${ic('<path d="m10 8 5 4-5 4V8Z"/><rect width="20" height="16" x="2" y="4" rx="2.5"/>')}${ex.verVideos} Verified Videos</div>
                  <div class="flex items-center gap-2">${ICON.loc}${esc(ex.loc)}</div>
                  <div class="flex items-center gap-2">${ic('<circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15 15 0 0 1 4 10 15 15 0 0 1-4 10 15 15 0 0 1-4-10 15 15 0 0 1 4-10Z"/>')}${esc(ex.lang)}</div>
                </dl>
              </div>

              <div class="mt-8 border-t border-white/15 pt-6">
                <p class="mono text-white/50">Client Reviews (${ex.reviews.length})</p>
                <div class="mt-4 overflow-hidden rounded-[18px] bg-[#2F3C3D] p-5 sm:p-6">
                  <div id="rv-body"></div>
                  <div class="mt-5 flex items-center justify-between">
                    <button type="button" id="rv-prev" class="grid h-9 w-9 place-items-center rounded-full bg-[#394546] text-white/70 transition-colors hover:bg-[#CEF79E] hover:text-ink" aria-label="Previous review">${ic('<path d="m15 18-6-6 6-6"/>', 16)}</button>
                    <div id="rv-dots" class="flex items-center gap-2"></div>
                    <button type="button" id="rv-next" class="grid h-9 w-9 place-items-center rounded-full bg-[#394546] text-white/70 transition-colors hover:bg-[#CEF79E] hover:text-ink" aria-label="Next review">${ic('<path d="m9 18 6-6-6-6"/>', 16)}</button>
                  </div>
                </div>
              </div>

              <div class="mt-8 border-t border-white/15 pt-6">
                <p class="mono text-white/50">Verified Clients (${ex.vClients.length})</p>
                <div class="mt-4 flex flex-wrap gap-3">${ex.vClients.map((c) => `<div class="w-16 text-center"><span class="relative mx-auto block h-16 w-16 overflow-hidden rounded-full ring-2 ring-[#FF8A8A]/70">${c.photo ? `<span class="block h-full w-full bg-cover bg-center" style="background-image:url('${c.photo}')"></span>` : `<span class="grid h-full w-full place-items-center font-mono text-[18px] text-white" style="background:${c.color}">${esc(c.name[0])}</span>`}</span><span class="mono mt-1.5 block truncate text-[11px] text-white/60">${fmtN(c.views)}</span></div>`).join("")}</div>
              </div>

              <div class="mt-6">
                <button type="button" id="claimed-toggle" class="mono inline-flex items-center gap-2 text-white/70 transition-colors hover:text-white">Claimed Clients (${ex.claimed.length})<span id="claimed-chevron" class="transition-transform">${ic('<path d="m6 9 6 6 6-6"/>', 14)}</span></button>
                <div id="claimed-list" hidden class="mt-3 flex flex-wrap gap-2">${ex.claimed.map((n) => `<span class="mono rounded-full border border-white/25 px-3 py-1.5 text-white/75">${esc(n)}</span>`).join("")}</div>
              </div>

              <div class="mt-8 border-t border-white/15 pt-6">
                <p class="text-[17px] leading-snug">Link a YouTube video of your own work that best fits with this job:</p>
                <a href="#" class="mt-4 flex gap-4 rounded-[16px] bg-[#2F3C3D] p-3 transition-colors hover:bg-[#394546]">
                  <span class="h-20 w-32 shrink-0 overflow-hidden rounded-[10px] bg-cover bg-center sm:h-24 sm:w-40" style="background-image:url('${ex.video.thumb}')"></span>
                  <div class="min-w-0 py-0.5"><div class="flex items-center gap-2">${yt}<span class="mono text-white/60">${fmtN(ex.video.views)} views &middot; ${fmtN(ex.video.likes)} likes</span></div>
                    <p class="mt-2 text-[15px] leading-snug">${esc(ex.video.title)}</p></div>
                </a>
              </div>

              <div class="mt-8 border-t border-white/15 pt-6">
                <p class="text-[17px] leading-snug">Briefly describe why you think you are a good fit for this job:</p>
                <p class="mono mt-3 break-all text-[#9FD6FF]">&quot;${esc(ex.fitLink)}&quot;</p>
              </div>

              <div class="mt-8 border-t border-white/15 pt-6">
                <p class="mono text-white/50">Application status</p>
                <div id="st" class="mt-4 flex flex-wrap gap-2"></div>
                <label class="lbl-f mt-6" for="msg">Message to candidate</label>
                <textarea id="msg" rows="4" class="field" placeholder="Write a message (optional)"></textarea>
                <form id="ra-form" onsubmit="return false"><button type="submit" class="mono mt-4 h-12 rounded-[12px] bg-[#CEF79E] px-6 text-ink transition-colors hover:bg-white">Save changes</button></form>
              </div>
            </div>
          </article>
        </div>`;
      drawReviews(); drawClaimed(); drawStatus(); updateMsgBtn();
    }
    const drawStatus = () => { $("st").innerHTML = STATUSES.map((x) => `<button type="button" data-st="${x}" aria-pressed="${status === x}" class="mono h-11 rounded-[10px] px-4 transition-colors ${status === x ? "bg-[#CEF79E] text-ink" : "bg-[#394546] text-white/85 hover:bg-[#4A5859]"}">${x}</button>`).join(""); };
    const canMessage = () => status === "Rejected" || status === "Shortlisted";
    const updateMsgBtn = () => { const b = $("msg-btn"); if (b) b.classList.toggle("opacity-40", !canMessage()); if (canMessage() && $("msg-tip")) $("msg-tip").hidden = true; };
    const BLUE_TICK = '<img src="assets/recruiter-verified.png" alt="Arclent Verified" class="shrink-0" style="width:16px;height:16px;object-fit:contain" />';
    let rvi = 0;
    function drawReviews() {
      const r = ex.reviews[rvi], long = r.text.length > 140;
      $("rv-body").innerHTML = `<div class="flex items-center gap-3">${avatar({ ini: r.name[0], c: COLORS[hash(r.name) % COLORS.length] }, 36)}<div class="min-w-0"><p class="flex items-center gap-1.5 text-[16px] leading-tight">${esc(r.name)}<span class="mono text-white/50">| ${esc(r.role)}</span><span class="rv-tick">${BLUE_TICK}</span></p><p class="mono mt-0.5 text-white/50">${fmtN(r.subs)} subscribers</p></div></div>
        <p class="mt-3 text-[15px] leading-snug text-white/80">${esc(r.text.slice(0, long ? 140 : r.text.length))}${long ? `... <button type="button" id="rv-more" class="mono text-[#CEF79E] underline underline-offset-4">Show more</button>` : ""}</p>`;
      $("rv-dots").innerHTML = ex.reviews.map((rv, i) => `<button type="button" data-rvi="${i}" aria-label="Review ${i + 1}" class="h-7 w-7 overflow-hidden rounded-full ${i === rvi ? "ring-2 ring-[#CEF79E]" : "opacity-50"}">${avatar({ ini: rv.name[0], c: COLORS[hash(rv.name) % COLORS.length] }, 28)}</button>`).join("");
      $("rv-prev").disabled = ex.reviews.length < 2; $("rv-next").disabled = ex.reviews.length < 2;
    }
    function drawClaimed() { $("claimed-toggle").addEventListener("click", () => { const open = $("claimed-list").hidden; $("claimed-list").hidden = !open; $("claimed-chevron").style.transform = open ? "rotate(180deg)" : ""; }); }
    document.addEventListener("click", (e) => {
      const b = e.target.closest("[data-st]"); if (b) { status = b.dataset.st; drawStatus(); updateMsgBtn(); }
      const act = e.target.closest("[data-act]"); if (act) { status = act.dataset.act; drawStatus(); p.s = status; p.upd = "just now"; try { sessionStorage.setItem(SKEY, status); } catch (x) {} draw(); say(`Marked as ${status}`); }
      const rvd = e.target.closest("[data-rvi]"); if (rvd) { rvi = +rvd.dataset.rvi; drawReviews(); }
      if (e.target.closest("#rv-prev")) { rvi = (rvi - 1 + ex.reviews.length) % ex.reviews.length; drawReviews(); }
      if (e.target.closest("#rv-next")) { rvi = (rvi + 1) % ex.reviews.length; drawReviews(); }
      if (e.target.closest("#rv-more")) { $("rv-body").querySelector("p.mt-3").textContent = ex.reviews[rvi].text; }
      if (e.target.closest("#msg-btn")) { if (canMessage()) location.href = "creator-messages.html"; else $("msg-tip").hidden = !$("msg-tip").hidden; }
      else if ($("msg-tip") && !$("msg-tip").hidden && !e.target.closest("#msg-tip")) $("msg-tip").hidden = true;
    });
    document.addEventListener("submit", (e) => {
      if (e.target.id !== "ra-form") return;
      const m = $("msg").value.trim(); p.s = status; p.upd = "just now"; try { sessionStorage.setItem(SKEY, status); } catch (x) {}
      draw(); say(m ? "Changes saved and message sent" : "Changes saved");
    });
    draw();
  </script>

  <script>
    // Sidebar navigation toggle: overlay drawer on mobile, push-content collapse on desktop.
    const sidebar = document.getElementById("sidebar");
    const backdrop = document.getElementById("sidebar-backdrop");
    const mainWrapper = document.getElementById("main-wrapper");
    const sidebarToggle = document.getElementById("sidebar-toggle");

    const isDesktop = () => window.innerWidth >= 1024;
    let sidebarOpen = isDesktop();

    function applySidebarState() {
      const desktop = isDesktop();
      sidebar.classList.toggle("collapsed", !sidebarOpen && desktop);
      sidebar.style.transform = sidebarOpen || desktop ? "translateX(0)" : "translateX(-100%)";
      mainWrapper.style.marginLeft = desktop ? (sidebarOpen ? "260px" : "72px") : "0px";
      backdrop.classList.toggle("hidden", !(sidebarOpen && !isDesktop()));
    }

    document.getElementById("sidebar-toggle-in").addEventListener("click", () => sidebarToggle.click());
    sidebarToggle.addEventListener("click", () => {
      sidebarOpen = !sidebarOpen;
      applySidebarState();
    });
    backdrop.addEventListener("click", () => {
      sidebarOpen = false;
      applySidebarState();
    });
    window.addEventListener("resize", applySidebarState);

    sidebar.querySelectorAll("nav a, :scope > button").forEach((el) => { el.title = el.textContent.trim(); });
    applySidebarState();
  </script>
  <script src="motion.js"></script>
  <script src="assets/help-fab.js" defer></script>
</body>
</html>
